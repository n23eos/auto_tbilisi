name = "avtoshkola-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "avtoshkola-bot"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

# Блока [vars] здесь СОЗНАТЕЛЬНО нет.
#
# При deploy содержимое [vars] затирает значения, выставленные в дашборде
# Cloudflare. Placeholder'ы ADMIN_CHAT_ID = "0" и ADMIN_IDS = "" молча
# возвращались бы после каждого `npm run deploy`: кнопки админов отвечали бы
# «Только для администраторов», карточки уходили бы в чат 0 и не доходили,
# заявки копились бы в pending — и ничто не показало бы причину.
#
# Поэтому ADMIN_CHAT_ID и ADMIN_IDS задаются через `wrangler secret put`
# (секретными они не являются, но так у них один источник истины и deploy их
# не трогает). Как их выставить — см. README.md.
